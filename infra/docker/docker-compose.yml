services:
  postgres:
    image: postgres:16-alpine
    container_name: lowcode-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lowcode_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lowcode_editor"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: apps/api-server/Dockerfile
    container_name: lowcode-editor-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lowcode_editor?schema=public
      JWT_SECRET: local-docker-development-secret-at-least-32-chars
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /workspace/apps/api-server/uploads
      UPLOAD_MAX_SIZE: 5242880
      PUBLISHER_SITE_URL: http://publisher:5174
      PUBLISHER_REVALIDATE_SECRET: local-docker-revalidate-secret
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run prisma:deploy && npm run start"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/workspace/apps/api-server/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: apps/editor-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLISHER_SITE_URL: http://localhost:5174
    container_name: lowcode-editor-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

  publisher:
    build:
      context: ../..
      dockerfile: apps/publisher-web/Dockerfile
      args:
        PUBLISHER_API_BASE_URL: http://server:3000/api
        PUBLISHER_SITE_URL: http://localhost:5174
        PUBLISHER_REVALIDATE_SECRET: local-docker-revalidate-secret
    container_name: lowcode-editor-publisher
    restart: unless-stopped
    environment:
      PUBLISHER_API_BASE_URL: http://server:3000/api
      PUBLISHER_SITE_URL: http://localhost:5174
      PUBLISHER_REVALIDATE_SECRET: local-docker-revalidate-secret
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5174:5174"

volumes:
  postgres_data:
  uploads_data:
